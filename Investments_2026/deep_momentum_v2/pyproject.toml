[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-momentum-v2-local"
version = "0.1.0"
description = "U.S. equity momentum research workspace"
requires-python = ">=3.11"
dependencies = ["pyarrow==26.0.0", "exchange-calendars==4.13.2", "pandas>=2.2,<4", "numpy>=1.26,<3"]

[project.optional-dependencies]
notebook = ["ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1", "pandas>=2.2,<4"]
models = ["scikit-learn==1.9.1", "xgboost==3.4.1", "scipy==1.18.1", "joblib==1.6.0", "threadpoolctl==3.7.0", "narwhals==2.27.1", "cloudpickle==3.1.2"]

[project.scripts]
dmv2 = "dmv2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
