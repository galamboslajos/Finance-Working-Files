[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-momentum-v2-local"
version = "0.1.0"
description = "U.S. equity momentum research workspace"
requires-python = ">=3.11"
dependencies = ["pyarrow==26.0.0"]

[project.scripts]
dmv2 = "dmv2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
